<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="760" height="290" fill="#ffffff"/>

  <!-- capacity annotation -->
  <text x="78" y="34" font-size="12.5" fill="#6b6b6b" font-style="italic">capacity c = 1: the chaining value, never revealed</text>

  <!-- chaining line -->
  <line x1="78"  y1="112" x2="126" y2="112" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#ar)"/>
  <line x1="196" y1="112" x2="266" y2="112" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#ar)"/>
  <line x1="336" y1="112" x2="406" y2="112" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#ar)"/>
  <line x1="476" y1="112" x2="546" y2="112" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#ar)"/>
  <line x1="616" y1="112" x2="690" y2="112" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#ar)"/>

  <!-- permutation boxes -->
  <g>
    <rect x="126" y="86" width="70" height="52" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="161" y="110" font-size="17" text-anchor="middle" font-style="italic">π</text>
    <text x="161" y="128" font-size="9.5" text-anchor="middle" fill="#555">Poseidon(5)</text>
  </g>
  <g>
    <rect x="266" y="86" width="70" height="52" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="301" y="110" font-size="17" text-anchor="middle" font-style="italic">π</text>
    <text x="301" y="128" font-size="9.5" text-anchor="middle" fill="#555">Poseidon(5)</text>
  </g>
  <text x="441" y="118" font-size="19" text-anchor="middle" fill="#1a1a1a">· · ·</text>
  <g>
    <rect x="546" y="86" width="70" height="52" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="581" y="110" font-size="17" text-anchor="middle" font-style="italic">π</text>
    <text x="581" y="128" font-size="9.5" text-anchor="middle" fill="#555">Poseidon(5)</text>
  </g>

  <!-- state labels -->
  <text x="40"  y="108" font-size="13.5" text-anchor="middle"><tspan font-style="italic">s</tspan><tspan font-size="0.72em" dy="3.5">0</tspan><tspan dy="-3.5" dx="2"> = 0</tspan></text>
  <text x="231" y="105" font-size="12" text-anchor="middle" fill="#6b6b6b"><tspan font-style="italic">s</tspan><tspan font-size="0.72em" dy="3">1</tspan></text>
  <text x="371" y="105" font-size="12" text-anchor="middle" fill="#6b6b6b"><tspan font-style="italic">s</tspan><tspan font-size="0.72em" dy="3">2</tspan></text>
  <text x="511" y="105" font-size="12" text-anchor="middle" fill="#6b6b6b"><tspan font-style="italic">s</tspan><tspan font-size="0.72em" dy="3"><tspan font-style="italic">n</tspan>−1</tspan></text>
  <text x="651" y="105" font-size="12" text-anchor="middle" fill="#6b6b6b"><tspan font-style="italic">s</tspan><tspan font-size="0.72em" dy="3" font-style="italic">n</tspan></text>
  <text x="700" y="117" font-size="13.5" text-anchor="start"><tspan font-style="italic">h</tspan><tspan font-size="0.7em" dy="3.5">batch</tspan></text>

  <!-- absorbed blocks -->
  <line x1="161" y1="188" x2="161" y2="142" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#arg)"/>
  <line x1="301" y1="188" x2="301" y2="142" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#arg)"/>
  <line x1="581" y1="188" x2="581" y2="142" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#arg)"/>

  <text x="161" y="204" font-size="13" text-anchor="middle"><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3" dx="3"> </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3" dx="3"> </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">3</tspan><tspan dy="-3" dx="3"> </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">4</tspan><tspan dy="-3" dx="3"> </tspan></text>
  <text x="301" y="204" font-size="13" text-anchor="middle"><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">5</tspan><tspan dy="-3" dx="3"> </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">6</tspan><tspan dy="-3" dx="3"> </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">7</tspan><tspan dy="-3" dx="3"> </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3">8</tspan><tspan dy="-3" dx="3"> </tspan></text>
  <text x="441" y="204" font-size="15" text-anchor="middle" fill="#1a1a1a">· · ·</text>
  <text x="581" y="204" font-size="13" text-anchor="middle"><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3"><tspan font-style="italic">B</tspan>−3</tspan><tspan dy="-3"> … </tspan><tspan font-style="italic">m</tspan><tspan font-size="0.72em" dy="3" font-style="italic">B</tspan></text>

  <text x="161" y="222" font-size="11.5" text-anchor="middle" fill="#6b6b6b" font-style="italic">rate r = 4</text>
  <text x="581" y="222" font-size="11.5" text-anchor="middle" fill="#6b6b6b" font-style="italic">zero-padded if B mod 4 ≠ 0</text>

  <!-- brace over the batch -->
  <path d="M110,244 q0,7 7,7 L314,251 q7,0 7,7 q0,-7 7,-7 L625,251 q7,0 7,-7"
        fill="none" stroke="#6b6b6b" stroke-width="1.2"/>
  <text x="371" y="278" font-size="12.5" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">B</tspan> packed field elements = one Nova fold</text>
</svg>
